{% load static %}

<header class="w-full sticky top-0 z-40 border-b"
        style="background-color:var(--bg); border-color:var(--border);">

  <nav class="max-w-7xl mx-auto px-6 lg:px-16 h-18 lg:h-20 flex items-center justify-between py-3">

    <!-- Logo -->
    <a href="{% url 'home' %}"
       class="text-lg lg:text-xl font-display font-bold tracking-tight"
       style="color:var(--text);">

      Rehan<span style="color:var(--accent);">.dev</span>

    </a>


    <!-- Desktop Navigation -->
    <div class="hidden lg:flex items-center gap-9 text-sm font-medium">

      <a href="{% url 'home' %}#services"
         class="transition hover:opacity-70"
         style="color:var(--text-muted);">
        Services
      </a>

      <a href="{% url 'experience' %}"
         class="transition hover:opacity-70"
         style="color:var(--text-muted);">
        Experience
      </a>

      <a href="{% url 'projects' %}"
         class="transition hover:opacity-70"
         style="color:var(--text-muted);">
        Projects
      </a>


      <!-- Desktop Theme Toggle -->
      <button type="button"
              data-theme-toggle
              aria-label="Toggle dark and light theme"
              class="w-10 h-10 rounded-full flex items-center justify-center transition"
              style="background-color:var(--surface-muted); color:var(--text);">

        <svg class="w-4 h-4 dark:hidden"
             fill="none"
             stroke="currentColor"
             stroke-width="2"
             viewBox="0 0 24 24">

          <path stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 3v1.5M12 19.5V21M4.5 12H3M21 12h-1.5M5.6 5.6l1.1 1.1M17.3 17.3l1.1 1.1M18.4 5.6l-1.1 1.1M6.7 17.3l-1.1 1.1M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>

        </svg>

        <svg class="w-4 h-4 hidden dark:block"
             fill="currentColor"
             viewBox="0 0 24 24">

          <path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/>

        </svg>

      </button>


      <!-- Desktop Contact -->
      <a href="{% url 'contact' %}"
         class="px-5 py-2.5 rounded-lg font-semibold text-sm transition hover:opacity-90"
         style="background-color:var(--accent); color:#0a0f10;">

        Contact me

      </a>

    </div>


    <!-- Mobile Buttons -->
    <div class="flex items-center gap-3 lg:hidden">

      <!-- Mobile Theme Toggle -->
      <button type="button"
              data-theme-toggle
              aria-label="Toggle dark and light theme"
              class="w-10 h-10 rounded-full flex items-center justify-center"
              style="background-color:var(--surface-muted); color:var(--text);">

        <svg class="w-4 h-4 dark:hidden"
             fill="none"
             stroke="currentColor"
             stroke-width="2"
             viewBox="0 0 24 24">

          <path stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 3v1.5M12 19.5V21M4.5 12H3M21 12h-1.5M5.6 5.6l1.1 1.1M17.3 17.3l1.1 1.1M18.4 5.6l-1.1 1.1M6.7 17.3l-1.1 1.1M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>

        </svg>

        <svg class="w-4 h-4 hidden dark:block"
             fill="currentColor"
             viewBox="0 0 24 24">

          <path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/>

        </svg>

      </button>


      <!-- Hamburger -->
      <button type="button"
              id="mobile-menu-btn"
              aria-label="Open navigation menu"
              aria-controls="mobile-menu"
              aria-expanded="false"
              class="w-10 h-10 rounded-full border flex items-center justify-center"
              style="border-color:var(--border); background-color:var(--surface-muted); color:var(--text);">

        <svg class="w-5 h-5"
             fill="none"
             stroke="currentColor"
             stroke-width="2"
             viewBox="0 0 24 24">

          <path stroke-linecap="round"
                stroke-linejoin="round"
                d="M4 7h16M4 12h16M4 17h16"/>

        </svg>

      </button>

    </div>

  </nav>

</header>


<!-- Mobile Sidebar Overlay -->
<div id="mobile-overlay"
     class="glass-overlay fixed inset-0 z-50 opacity-0 invisible transition-all duration-500 lg:hidden">
</div>


<!-- Mobile Sidebar -->
<!-- Modern Mobile Sidebar -->
<aside id="mobile-menu"
       role="dialog"
       aria-modal="true"
       aria-label="Mobile navigation"
       aria-hidden="true"
       inert
       class="glass-sidebar fixed top-0 right-0 h-full w-[85%] max-w-[340px] z-[60] translate-x-full transition-transform duration-500 ease-in-out lg:hidden">

  <div class="flex flex-col h-full">

    <!-- Sidebar Header -->
    <div class="px-6 pt-8 pb-6 border-b"
         style="border-color:var(--border);">

      <div class="flex items-start justify-between">

        <div>
          <h2 class="font-display text-xl font-bold tracking-tight"
              style="color:var(--text);">

            Rehan<span style="color:var(--accent);">.dev</span>

          </h2>

          <p class="text-[11px] mt-1 tracking-wide"
             style="color:var(--text-muted);">

            DEVELOPER PORTFOLIO

          </p>
        </div>


        <!-- Close Button -->
        <button id="mobile-menu-close"
                type="button"
                aria-label="Close navigation menu"
                class="w-10 h-10 rounded-xl flex items-center justify-center transition hover:rotate-90"
                style="background-color:var(--surface-muted); color:var(--text);">

          <svg class="w-5 h-5"
               fill="none"
               stroke="currentColor"
               stroke-width="2"
               viewBox="0 0 24 24">

            <path stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M6 6l12 12M18 6L6 18"/>

          </svg>

        </button>

      </div>

    </div>


    <!-- Navigation -->
    <nav class="flex-1 px-4 py-8 space-y-2">

      <p class="text-[10px] font-bold uppercase tracking-[0.2em] px-4 mb-5"
         style="color:var(--text-muted);">

        Navigation

      </p>


      <!-- Home -->
      <a href="{% url 'home' %}"
         class="mobile-nav-link sidebar-link flex items-center gap-4 px-4 py-3.5 rounded-xl transition-all duration-300
         {% if request.resolver_match.url_name == 'home' %}sidebar-active{% endif %}">

        <svg class="w-5 h-5 shrink-0"
             fill="none"
             stroke="currentColor"
             stroke-width="1.8"
             viewBox="0 0 24 24">

          <path stroke-linecap="round"
                stroke-linejoin="round"
                d="M3 10.5L12 3l9 7.5V21h-6v-6H9v6H3V10.5z"/>

        </svg>

        <span class="text-sm font-medium">
          Home
        </span>

      </a>


      <!-- Services -->
      <a href="{% url 'home' %}#services"
         class="mobile-nav-link sidebar-link flex items-center gap-4 px-4 py-3.5 rounded-xl transition-all duration-300">

        <svg class="w-5 h-5 shrink-0"
             fill="none"
             stroke="currentColor"
             stroke-width="1.8"
             viewBox="0 0 24 24">

          <path stroke-linecap="round"
                stroke-linejoin="round"
                d="M13 2L3 14h8l-1 8 11-13h-8V2z"/>

        </svg>

        <span class="text-sm font-medium">
          Services
        </span>

      </a>


      <!-- Experience -->
      <a href="{% url 'experience' %}"
         class="mobile-nav-link sidebar-link flex items-center gap-4 px-4 py-3.5 rounded-xl transition-all duration-300
         {% if request.resolver_match.url_name == 'experience' %}sidebar-active{% endif %}">

        <svg class="w-5 h-5 shrink-0"
             fill="none"
             stroke="currentColor"
             stroke-width="1.8"
             viewBox="0 0 24 24">

          <path stroke-linecap="round"
                stroke-linejoin="round"
                d="M4 7h16v13H4V7zm5 0V4h6v3M4 12h16"/>

        </svg>

        <span class="text-sm font-medium">
          Experience
        </span>

      </a>


      <!-- Projects -->
      <a href="{% url 'projects' %}"
         class="mobile-nav-link sidebar-link flex items-center gap-4 px-4 py-3.5 rounded-xl transition-all duration-300
         {% if request.resolver_match.url_name == 'projects' %}sidebar-active{% endif %}">

        <svg class="w-5 h-5 shrink-0"
             fill="none"
             stroke="currentColor"
             stroke-width="1.8"
             viewBox="0 0 24 24">

          <path stroke-linecap="round"
                stroke-linejoin="round"
                d="M3 7h7l2 2h9v11H3V7z"/>

        </svg>

        <span class="text-sm font-medium">
          Projects
        </span>

      </a>


      <!-- Contact Button -->
      <div class="pt-6 px-1">

        <a href="{% url 'contact' %}"
           class="mobile-nav-link flex items-center justify-between px-5 py-4 rounded-xl font-semibold text-sm transition-all duration-300 hover:scale-[1.02]"
           style="background-color:var(--accent); color:#0a0f10;">

          <span>Let's work together</span>

          <svg class="w-5 h-5"
               fill="none"
               stroke="currentColor"
               stroke-width="2"
               viewBox="0 0 24 24">

            <path stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M5 12h14m-6-6l6 6-6 6"/>

          </svg>

        </a>

      </div>

    </nav>


    <!-- Bottom Area -->
    <div class="px-6 py-6 border-t"
         style="border-color:var(--border);">

      <!-- Availability Badge -->
      <div class="flex items-center gap-2 mb-5">

        <span class="relative flex h-2.5 w-2.5">

          <span class="animate-ping absolute inline-flex h-full w-full rounded-full opacity-75"
                style="background-color:#22c55e;"></span>

          <span class="relative inline-flex rounded-full h-2.5 w-2.5"
                style="background-color:#22c55e;"></span>

        </span>

        <span class="text-xs font-medium"
              style="color:var(--text-muted);">

          Open to opportunities

        </span>

      </div>


      <!-- Social Links -->
      <div class="flex items-center gap-3 mb-5">

        <!-- LinkedIn -->
        <a href="https://www.linkedin.com/in/muhammad-shaheem-ur-rehan-90a5a9371/"
           target="_blank"
           rel="noopener noreferrer"
           aria-label="LinkedIn"
           class="w-10 h-10 rounded-xl flex items-center justify-center transition hover:-translate-y-1"
           style="background-color:var(--surface-muted); color:var(--text);">

          <svg class="w-5 h-5"
               viewBox="0 0 24 24"
               fill="currentColor">

            <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.35V9h3.414v1.561h.049c.476-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 110-4.124 2.062 2.062 0 010 4.124zM7.119 20.452H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>

          </svg>

        </a>


        <!-- GitHub -->
        <a href="https://github.com/"
           target="_blank"
           rel="noopener noreferrer"
           aria-label="GitHub"
           class="w-10 h-10 rounded-xl flex items-center justify-center transition hover:-translate-y-1"
           style="background-color:var(--surface-muted); color:var(--text);">

          <svg class="w-5 h-5"
               viewBox="0 0 24 24"
               fill="currentColor">

            <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>

          </svg>

        </a>


        <!-- WhatsApp -->
        <a href="https://wa.me/923303332334"
           target="_blank"
           rel="noopener noreferrer"
           aria-label="WhatsApp"
           class="w-10 h-10 rounded-xl flex items-center justify-center transition hover:-translate-y-1"
           style="background-color:var(--surface-muted); color:#25D366;">

          <svg class="w-5 h-5"
               viewBox="0 0 24 24"
               fill="currentColor">

            <path d="M20.52 3.48A11.87 11.87 0 0012.05 0C5.5 0 .16 5.34.15 11.89a11.8 11.8 0 001.59 5.94L.05 24l6.32-1.66a11.87 11.87 0 005.68 1.45h.01c6.55 0 11.89-5.34 11.9-11.89a11.8 11.8 0 00-3.44-8.42zM12.06 21.8a9.9 9.9 0 01-5.05-1.38l-.36-.21-3.75.98 1-3.65-.24-.38a9.87 9.87 0 01-1.52-5.27c0-5.46 4.45-9.91 9.92-9.91a9.83 9.83 0 017.01 2.91 9.84 9.84 0 012.9 7.01c0 5.47-4.45 9.91-9.91 9.91zm5.44-7.42c-.3-.15-1.77-.87-2.04-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.47-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.49s1.07 2.89 1.22 3.09c.15.2 2.1 3.2 5.09 4.49.71.31 1.27.49 1.7.62.71.23 1.36.2 1.87.12.57-.09 1.77-.72 2.02-1.42.25-.7.25-1.3.17-1.42-.07-.12-.27-.2-.57-.35z"/>

          </svg>

        </a>

      </div>


      <!-- Footer -->
      <p class="text-[10px]"
         style="color:var(--text-muted);">

        Designed &amp; developed by Rehan.

      </p>

    </div>

  </div>

</aside>
