{% load static %}
<header class="w-full sticky top-0 z-50 border-b" style="background-color:var(--bg); border-color:var(--border);">
  <nav class="max-w-7xl mx-auto px-6 lg:px-16 h-18 lg:h-20 flex items-center justify-between py-3">

    <a href="{% url 'home' %}" class="text-lg lg:text-xl font-display font-bold tracking-tight" style="color:var(--text);">
      Rehan<span style="color:var(--accent);">.dev</span>
    </a>

    <div class="hidden lg:flex items-center gap-9 text-sm font-medium">
      <a href="{% url 'home' %}#services" class="transition hover:opacity-70" style="color:var(--text-muted);">Services</a>
      <a href="{% url 'experience' %}" class="transition hover:opacity-70" style="color:var(--text-muted);">Experience</a>
      <a href="{% url 'projects' %}" class="transition hover:opacity-70" style="color:var(--text-muted);">Projects</a>

      <button type="button" data-theme-toggle aria-label="Toggle dark and light theme"
              class="w-10 h-10 rounded-full flex items-center justify-center transition"
              style="background-color:var(--surface-muted); color:var(--text);">
        <svg class="w-4 h-4 dark:hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1.5M12 19.5V21M4.5 12H3M21 12h-1.5M5.6 5.6l1.1 1.1M17.3 17.3l1.1 1.1M18.4 5.6l-1.1 1.1M6.7 17.3l-1.1 1.1M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        <svg class="w-4 h-4 hidden dark:block" fill="currentColor" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>
      </button>

      <a href="{% url 'contact' %}"
         class="px-5 py-2.5 rounded-lg font-semibold text-sm transition hover:opacity-90"
         style="background-color:var(--accent); color:#0a0f10;">
        Contact me
      </a>
    </div>

    <div class="flex items-center gap-2 lg:hidden">
      <button type="button" data-theme-toggle aria-label="Toggle dark and light theme"
              class="w-10 h-10 rounded-full flex items-center justify-center"
              style="background-color:var(--surface-muted); color:var(--text);">
        <svg class="w-4 h-4 dark:hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1.5M12 19.5V21M4.5 12H3M21 12h-1.5M5.6 5.6l1.1 1.1M17.3 17.3l1.1 1.1M18.4 5.6l-1.1 1.1M6.7 17.3l-1.1 1.1M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        <svg class="w-4 h-4 hidden dark:block" fill="currentColor" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>
      </button>
      <button type="button" id="mobile-menu-btn" aria-label="Open menu"
              class="w-10 h-10 rounded-full flex items-center justify-center"
              style="background-color:var(--surface-muted); color:var(--text);">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </nav>

  <div id="mobile-menu" class="hidden lg:hidden border-t px-6 py-4 flex flex-col gap-4 text-sm font-medium"
       style="border-color:var(--border); background-color:var(--bg);">
    <a href="{% url 'home' %}#services" style="color:var(--text);">Services</a>
    <a href="{% url 'experience' %}" style="color:var(--text);">Experience</a>
    <a href="{% url 'projects' %}" style="color:var(--text);">Projects</a>
    <a href="{% url 'contact' %}" class="text-center px-5 py-2.5 rounded-lg font-semibold" style="background-color:var(--accent); color:#0a0f10;">Contact me</a>
  </div>
</header>
