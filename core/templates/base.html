<head>

  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
      var isDark = saved ? saved === 'dark' : !prefersLight;
      document.documentElement.classList.toggle('dark', isDark);
    })();
  </script>

  <script>

  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

  <style>
    :root {
      --bg: #F5F3EE;
      --panel: #ECE8DF;
      --surface: #FFFFFF;
      --surface-muted: #EFEDE7;
      --text: #14161A;
      --text-muted: #5B5E66;
      --border: #E1DED4;
      --accent: #0F8B8D;
      --accent-strong: #0B6C6E;
      --accent-2: #3557A6;
      --accent-3: #A8671E;
      --accent-soft: rgba(15,139,141,0.10);
    }
    html.dark {
      --bg: #10141B;
      --panel: #1B2230;
      --surface: #161B24;
      --surface-muted: #1E2530;
      --text: #F2F1ED;
      --text-muted: #9CA3AF;
      --border: #2A313D;
      --accent: #35C9C1;
      --accent-strong: #24A39C;
      --accent-2: #7C8CFF;
      --accent-3: #E3B341;
      --accent-soft: rgba(53,201,193,0.12);
    }
    body { background-color: var(--bg); color: var(--text); }
    ::selection { background: var(--accent); color: #0a0a0a; }
    .dot-grid {
      background-image: radial-gradient(var(--border) 1px, transparent 1px);
      background-size: 22px 22px;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
    }
    /* Floating WhatsApp */

.whatsapp-float {
  animation: whatsappPulse 2.5s infinite;
}

@keyframes whatsappPulse {

  0% {
    box-shadow: 0 0 0 0 rgba(37,211,102,0.4);
  }

  70% {
    box-shadow: 0 0 0 15px rgba(37,211,102,0);
  }

  100% {
    box-shadow: 0 0 0 0 rgba(37,211,102,0);
  }

}

/* Mobile sidebar links */

.mobile-nav-link:hover {
  background-color: var(--surface-muted);
}

/* Mobile sidebar scrolling */

#mobile-menu {
  overflow-y: auto;
  overscroll-behavior: contain;
}

/* Smooth sidebar */

#mobile-menu,
#mobile-overlay {
  will-change: transform, opacity;
}

/* Disable animation for reduced-motion users */

@media (prefers-reduced-motion: reduce) {
  .whatsapp-float {
    animation: none;
  }
}

/* ================================
   GLASSMORPHISM MOBILE SIDEBAR
================================ */

/* Light Theme */

.glass-sidebar {
    background: rgba(245, 243, 238, 0.78);

    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);

    border-left: 1px solid rgba(255, 255, 255, 0.35);

    box-shadow:
        -15px 0 50px rgba(0, 0, 0, 0.12),
        inset 1px 0 0 rgba(255, 255, 255, 0.3);
}

/* Dark Theme */

html.dark .glass-sidebar {
    background: rgba(22, 27, 36, 0.78);

    border-left: 1px solid rgba(255, 255, 255, 0.08);

    box-shadow:
        -15px 0 60px rgba(0, 0, 0, 0.45),
        inset 1px 0 0 rgba(255, 255, 255, 0.04);
}


/* Sidebar Navigation Links */

.glass-sidebar .sidebar-link {
    transition: all 0.25s ease;
}

.glass-sidebar .sidebar-link:hover {
    background: var(--accent-soft);
    color: var(--accent);
    transform: translateX(4px);
}


/* Active Navigation */

.glass-sidebar .sidebar-active {
    background: var(--accent-soft);
    color: var(--accent);
}


/* Sidebar Header */

.glass-sidebar > div > div:first-child {
    background: transparent;
}


/* Smooth Glass Animation */

.glass-sidebar {
    will-change: transform;
}


/* Mobile performance */

@media (max-width: 768px) {

    .glass-sidebar {
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
    }

}


/* Reduced Motion */

@media (prefers-reduced-motion: reduce) {

    .glass-sidebar,
    .glass-sidebar .sidebar-link {
        transition: none;
    }

}

/* ===========================
   Modern Mobile Sidebar
=========================== */

/* Default navigation links */

.sidebar-link {
  color: var(--text-muted);
  position: relative;
}

/* Hover effect */

.sidebar-link:hover {
  background-color: var(--surface-muted);
  color: var(--accent);
  transform: translateX(3px);
}

/* Active page */

.sidebar-active {
  background-color: var(--accent-soft);
  color: var(--accent) !important;
  font-weight: 600;
}

/* Active indicator */

.sidebar-active::before {
  content: "";
  position: absolute;
  left: 0;
  top: 25%;
  height: 50%;
  width: 3px;
  border-radius: 10px;
  background-color: var(--accent);
}

/* Sidebar entrance animation */

@keyframes sidebarItemFade {

  from {
    opacity: 0;
    transform: translateX(15px);
  }

  to {
    opacity: 1;
    transform: translateX(0);
  }

}

#mobile-menu:not(.translate-x-full) .sidebar-link {
  animation: sidebarItemFade 0.4s ease both;
}

/* Staggered animation */

#mobile-menu:not(.translate-x-full) .sidebar-link:nth-child(2) {
  animation-delay: 0.05s;
}

#mobile-menu:not(.translate-x-full) .sidebar-link:nth-child(3) {
  animation-delay: 0.1s;
}

#mobile-menu:not(.translate-x-full) .sidebar-link:nth-child(4) {
  animation-delay: 0.15s;
}

#mobile-menu:not(.translate-x-full) .sidebar-link:nth-child(5) {
  animation-delay: 0.2s;
}

/* Better sidebar scrolling */

#mobile-menu {
  overflow-y: auto;
  overscroll-behavior: contain;
}

/* Light mode overlay */

.glass-overlay {
    background: rgba(16, 20, 27, 0.25);

    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
}


/* Dark mode overlay */

html.dark .glass-overlay {
    background: rgba(0, 0, 0, 0.55);

    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
}

/* Decorative teal glow */

.glass-sidebar::before {
    content: "";

    position: absolute;

    width: 220px;
    height: 220px;

    top: -100px;
    right: -100px;

    background: radial-gradient(
        circle,
        rgba(15, 139, 141, 0.18),
        transparent 70%
    );

    pointer-events: none;
    z-index: -1;
}


/* Dark mode teal glow */

html.dark .glass-sidebar::before {
    background: radial-gradient(
        circle,
        rgba(53, 201, 193, 0.16),
        transparent 70%
    );
}

/* Reduced motion support */

@media (prefers-reduced-motion: reduce) {

  #mobile-menu:not(.translate-x-full) .sidebar-link {
    animation: none;
  }

}
  </style>
</head>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init({ once: true, duration: 600 });

    document.querySelectorAll('[data-theme-toggle]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
      });
    });

   // Mobile Sidebar

const menuBtn = document.getElementById('mobile-menu-btn');

const mobileMenu = document.getElementById('mobile-menu');

const menuClose = document.getElementById('mobile-menu-close');

const overlay = document.getElementById('mobile-overlay');

let previousFocus = null;


// Open sidebar
function openSidebar() {

  previousFocus = document.activeElement;

  mobileMenu.classList.remove('translate-x-full');

  overlay.classList.remove('opacity-0', 'invisible');

  document.body.style.overflow = 'hidden';

  menuBtn.setAttribute('aria-expanded', 'true');

  mobileMenu.setAttribute('aria-hidden', 'false');

  mobileMenu.removeAttribute('inert');

  menuClose.focus();

  menuBtn.setAttribute('aria-expanded', 'true');

}


// Close sidebar
function closeSidebar() {

  mobileMenu.classList.add('translate-x-full');

  overlay.classList.add('opacity-0', 'invisible');

  document.body.style.overflow = '';

  menuBtn.setAttribute('aria-expanded', 'false');

  mobileMenu.setAttribute('aria-hidden', 'true');

  mobileMenu.setAttribute('inert', '');

  menuBtn.setAttribute('aria-expanded', 'false');

  if (previousFocus && typeof previousFocus.focus === 'function') {
    previousFocus.focus();
  }

}


// Open when hamburger clicked
if (menuBtn && mobileMenu && menuClose && overlay) {

  menuBtn.addEventListener('click', openSidebar);


  // Close button
  menuClose.addEventListener('click', closeSidebar);


  // Close when clicking background
  overlay.addEventListener('click', closeSidebar);


  // Close when clicking navigation links
  document.querySelectorAll('.mobile-nav-link').forEach(function(link) {

    link.addEventListener('click', closeSidebar);

  });


  // Keyboard support
  document.addEventListener('keydown', function(event) {

    if (event.key === 'Escape' &&
        menuBtn.getAttribute('aria-expanded') === 'true') {

      closeSidebar();

    }

    if (event.key === 'Tab' &&
        menuBtn.getAttribute('aria-expanded') === 'true') {

      const focusable = Array.from(
        mobileMenu.querySelectorAll(
          'a[href], button:not([disabled])'
        )
      );

      const first = focusable[0];
      const last = focusable[focusable.length - 1];

      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }

    }

  });


  // Close sidebar if resized to desktop
  window.addEventListener('resize', function() {

    if (window.innerWidth >= 1024 &&
        menuBtn.getAttribute('aria-expanded') === 'true') {

      closeSidebar();

    }

  });

}
  </script>
